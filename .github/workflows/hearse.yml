# Mesin HEARSE, dijalankan oleh server GitHub — bukan laptopmu.
#
# Berjalan tiap 2 jam. Tiap kali jalan:
#   1. cari token pump.fun yang baru mati
#   2. tulis obituarinya lewat Groq
#   3. kirim ke channel Telegram
#   4. simpan ke arsip, lalu commit ke repo ini
#   5. Vercel melihat commit itu dan memperbarui website otomatis

name: HEARSE — bury the dead

on:
  schedule:
    # Tiap JAM, bukan tiap 2 jam.
    #
    # Bukan karena kami butuh sesering itu — 3 pemakaman per jam sudah lebih
    # dari cukup. Ini soal keandalan: penjadwal GitHub di runner gratis
    # diam-diam melewatkan sebagian jadwal saat servernya sibuk. Tercatat
    # nyata di repo ini: jeda 4 jam, lalu 9 jam 24 menit, padahal
    # jadwalnya 2 jam. Kira-kira separuh jadwal menguap.
    #
    # Dengan jadwal per jam, separuh yang hilang masih menyisakan sekitar
    # satu jalan tiap dua jam — yang memang target sebenarnya. Tidak ada
    # ruginya: kalau tidak ada yang mati, mesin keluar tanpa menulis apa pun.
    #
    # Menit 17, bukan 0 — menit 0 adalah menit tersibuk di seluruh GitHub
    # dan jadwal di menit itu paling sering dikorbankan.
    #
    # DUA jadwal, bukan satu. Tiap entri dilewatkan atau tidak secara
    # terpisah, jadi dua entri = dua kesempatan per jam. Terpantau nyata:
    # slot 13:17 dan 14:17 sama-sama menguap tanpa jejak. Kalau keduanya
    # kebetulan jalan berdekatan, concurrency group di bawah yang menahan
    # supaya tidak tumpang tindih — dan jalan kedua keluar tanpa menulis
    # apa-apa kalau tidak ada kematian baru.
    - cron: "17 * * * *"
    - cron: "43 * * * *"
  # Tombol "Run workflow" manual di tab Actions — untuk uji coba
  workflow_dispatch:

# Diperlukan supaya workflow boleh menulis balik arsipnya ke repo
permissions:
  contents: write

# Kalau jadwal sebelumnya belum selesai, jangan tumpuk
concurrency:
  group: hearse-burials
  cancel-in-progress: false

jobs:
  bury:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ambil kode terbaru
        uses: actions/checkout@v7

      - name: Siapkan Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Jalankan pemakaman
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          MAX_BURIALS_PER_RUN: ${{ vars.MAX_BURIALS_PER_RUN }}
        run: node hearse.js

      - name: Simpan arsip ke repo
        run: |
          git config user.name  "HEARSE"
          git config user.email "hearse@users.noreply.github.com"
          git add data/ site/data/
          # Kalau tidak ada yang mati, tidak ada yang perlu di-commit
          if git diff --staged --quiet; then
            echo "Tidak ada kematian baru. Tidak ada yang dicatat."
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./data/obituaries.json').length)")
          git commit -m "burial: register now holds ${COUNT} obituaries"

          # Repo bisa berubah saat job berjalan. Kalau rebase bentrok di berkas
          # arsip (mesin dan manusia sama-sama menambah entri di ujung array),
          # git menyisipkan penanda konflik ke dalam JSON dan website jadi blank.
          # merge-archive.js menggabungkan kedua sisi dan membuang duplikat.
          if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
            echo "Rebase bentrok — menggabungkan arsip secara semantik."
            node scripts/merge-archive.js
            git add data/ site/data/
            GIT_EDITOR=true git rebase --continue || git rebase --skip
          fi

          # Jaring pengaman terakhir: jangan pernah dorong JSON yang cacat
          node -e "JSON.parse(require('fs').readFileSync('site/data/obituaries.json','utf8'))" \
            || { echo '::error::arsip tidak valid, push dibatalkan'; exit 1; }

          git push origin "HEAD:${GITHUB_REF_NAME}"
