<!doctype html><meta charset=utf-8>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1000px;height:1000px;overflow:hidden}
.f{width:1000px;height:1000px;position:relative;display:flex;
   align-items:center;justify-content:center;overflow:hidden;
   background:radial-gradient(ellipse 85% 75% at 50% 18%,#111621,#06070A 76%)}
/* kertas grafik samar — menautkan avatar ke bahasa visual situs */
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#161B24 2px,transparent 2px),
                   linear-gradient(90deg,#161B24 2px,transparent 2px);
  background-size:125px 125px;opacity:.55}
.stone{position:relative;width:610px;height:770px;
  background:linear-gradient(166deg,#39414E 0%,#252C37 42%,#161B23 100%);
  border-radius:305px 305px 30px 30px;
  box-shadow:inset 0 7px 0 rgba(255,255,255,.16),
             inset 0 -40px 70px rgba(0,0,0,.55),
             0 46px 100px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center}
/* garis ukir di dalam batu */
.stone::after{content:"";position:absolute;inset:26px 26px 24px;
  border-radius:284px 284px 14px 14px;border:2px solid rgba(255,255,255,.075)}
.pulse{position:relative;width:452px;
  filter:drop-shadow(0 0 30px rgba(229,72,77,.75)) drop-shadow(0 0 8px rgba(255,120,124,.6))}
.ground{position:absolute;left:70px;right:70px;bottom:112px;height:3px;
  background:linear-gradient(90deg,transparent,#39414E 20%,#39414E 80%,transparent)}
</style>
<div class="f">
  <div class="grid"></div>
  <div class="stone">
    <svg class="pulse" viewBox="0 0 200 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 55 L52 55 L67 14 L90 100 L107 34 L120 55 L196 55"
            stroke="#FF5257" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="ground"></div>
</div>
